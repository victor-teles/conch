pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,json,md,mdx,css}"
      exclude:
        - ".agents/**"
        - ".claude/**"
      run: . scripts/git-hook-env.sh && bun x ultracite fix {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{js,jsx,ts,tsx,json,md,mdx,css}"
      exclude:
        - ".agents/**"
        - ".claude/**"
      run: . scripts/git-hook-env.sh && bun x ultracite check {staged_files}

    - name: check-types
      glob: "{apps,packages}/**/*.{ts,tsx}"
      run: . scripts/git-hook-env.sh && bun run check-types

pre-push:
  jobs:
    - name: test
      run: . scripts/git-hook-env.sh && bun run --cwd apps/app test
