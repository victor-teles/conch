name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Rolling release that holds the in-app update feed (see electrobun.config.ts).
  UPDATE_FEED_TAG: updates

jobs:
  resolve-channel:
    name: Resolve release channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.parse.outputs.channel }}
      electrobun_env: ${{ steps.parse.outputs.electrobun_env }}
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
            ELECTROBUN_ENV="stable"
            PRERELEASE="false"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            CHANNEL="beta"
            ELECTROBUN_ENV="canary"
            PRERELEASE="true"
          else
            echo "::error::Tag ${TAG} does not match v<X>.<Y>.<Z> (stable) or v<X>.<Y>.<Z>-beta.<N> (beta)"
            exit 1
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "electrobun_env=${ELECTROBUN_ENV}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  bump-version:
    name: Bump version from tag
    needs: resolve-channel
    if: needs.resolve-channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump version in electrobun.config.ts
        run: |
          VERSION="${{ needs.resolve-channel.outputs.version }}"
          sed -i "s/version: \"[^\"]*\"/version: \"$VERSION\"/" apps/app/electrobun.config.ts

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/app/electrobun.config.ts
          git diff --staged --quiet && exit 0
          git commit -m "chore: bump version to ${{ needs.resolve-channel.outputs.version }}"
          git push origin main

  prepare-releases:
    name: Create the release and the update feed
    needs: resolve-channel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the release for this tag
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            exit 0
          fi
          FLAGS=(--generate-notes --title "Conch ${{ needs.resolve-channel.outputs.version }}")
          if [ "${{ needs.resolve-channel.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${FLAGS[@]}"

      - name: Create the update feed release
        run: |
          if gh release view "$UPDATE_FEED_TAG" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$UPDATE_FEED_TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Update feed" \
            --notes "Files the in-app updater downloads. Each release replaces them. Do not delete this release; download Conch from the newest versioned release instead."

  build-macos:
    name: Build macOS (${{ matrix.arch }}) [${{ needs.resolve-channel.outputs.channel }}]
    needs: [resolve-channel, bump-version, prepare-releases]
    if: always() && needs.resolve-channel.result == 'success' && needs.prepare-releases.result == 'success' && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-channel.outputs.channel == 'stable' && 'main' || github.ref }}

      - name: Require signing for a stable release
        if: needs.resolve-channel.outputs.channel == 'stable' && env.APPLE_CERTIFICATE == ''
        run: |
          echo "::error::A stable release must be signed and notarized. Add the APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID secrets (see RELEASING.md)."
          exit 1

      - name: Note unsigned beta build
        if: needs.resolve-channel.outputs.channel == 'beta' && env.APPLE_CERTIFICATE == ''
        run: |
          echo "::warning::This beta is unsigned: macOS will block it until the tester removes the quarantine flag. Add the Apple signing secrets (see RELEASING.md)."

      - name: Stamp beta version
        if: needs.resolve-channel.outputs.channel == 'beta'
        run: |
          VERSION="${{ needs.resolve-channel.outputs.version }}"
          sed -i '' "s/version: \"[^\"]*\"/version: \"$VERSION\"/" apps/app/electrobun.config.ts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Cache Electrobun toolchain
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)

      - name: Build Electrobun app
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ELECTROBUN_APPLEID: ${{ secrets.APPLE_ID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.APPLE_PASSWORD }}
          ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: apps/app
        run: |
          bun run desktop:package
          bunx electrobun build --env=${{ needs.resolve-channel.outputs.electrobun_env }}

      - name: Upload the installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-channel.outputs.version }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          SRC=$(find apps/app/artifacts -maxdepth 1 -name "*macos-${BUILD_ARCH}*.dmg" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::No macOS ${BUILD_ARCH} DMG found in apps/app/artifacts/"
            ls -la apps/app/artifacts/ || true
            exit 1
          fi
          DEST="Conch_${VERSION}_${BUILD_ARCH}.dmg"
          cp "$SRC" "$DEST"
          gh release upload "$GITHUB_REF_NAME" "$DEST" --clobber

      - name: Publish the update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: apps/app/artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLES=(*.tar.zst *.patch)
          MANIFESTS=(*-update-v2.json *-update.json)
          if [ "${#BUNDLES[@]}" -eq 0 ] || [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "::error::The build produced no update bundle or manifest"
            ls -la
            exit 1
          fi
          # Bundles first: a manifest must never point at a bundle that is not there yet.
          gh release upload "$UPDATE_FEED_TAG" "${BUNDLES[@]}" --clobber
          gh release upload "$UPDATE_FEED_TAG" "${MANIFESTS[@]}" --clobber

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: [resolve-channel, build-macos]
    if: needs.resolve-channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    steps:
      - name: Download DMGs and compute SHA256
        id: hashes
        env:
          VERSION: ${{ needs.resolve-channel.outputs.version }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"

          curl -fsSL "${BASE}/Conch_${VERSION}_arm64.dmg" -o arm64.dmg
          curl -fsSL "${BASE}/Conch_${VERSION}_x64.dmg" -o x64.dmg

          echo "arm64_sha=$(shasum -a 256 arm64.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "x64_sha=$(shasum -a 256 x64.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Dispatch tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: victor-teles/homebrew-tap
          event-type: update-conch-cask
          client-payload: |
            {
              "version": "${{ needs.resolve-channel.outputs.version }}",
              "arm64_sha": "${{ steps.hashes.outputs.arm64_sha }}",
              "x64_sha": "${{ steps.hashes.outputs.x64_sha }}"
            }
